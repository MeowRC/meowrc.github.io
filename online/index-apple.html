(function () {
  var ua = navigator.userAgent || '';
  var dm = document.documentMode;

  /* IE8 ~ IE11（含 IE11 兼容视图）走专门的 ie 版本 */
  function isLegacyIE() {
    if (dm && dm <= 11) return true;
    return (/MSIE |Trident\//).test(ua);
  }

  function isSafariFamily() {
    if ((/iPad|iPhone|iPod/).test(ua)) return true;
    if (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) return true;
    if ((/Safari/).test(ua) &&
        !(/Chrome|Chromium|CriOS|Edg|OPR|Firefox|FxiOS/).test(ua)) return true;
    return false;
  }

  function isModern() {
    if (!window.CSS || !CSS.supports) return false;
    try {
      return !!CSS.supports('translate', '0 64px') && !!CSS.supports('inset', '0');
    } catch (e) { return false; }
  }

  var target;
  if (isLegacyIE())          target = 'index-ie.html';
  else if (isSafariFamily()) target = 'index-apple.html';
  else if (isModern())       target = 'index.html';
  else                       target = 'index-legacy.html';

  var suffix = '/' + target;

(function () {
  var OVERRIDE_TTL = 6 * 60 * 60 * 1000;

  function autoTheme() {
    try {
      var h = new Date().getHours();
      return (h >= 6 && h < 18) ? 'light' : 'dark';
    } catch (e) {
      try {
        return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (err) {

  function hasManualOverride() {
    try {
      var stored = localStorage.getItem('theme');
      var at = parseInt(localStorage.getItem('themeAt') || '0', 10);
      return (stored === 'dark' || stored === 'light') &&
             (Date.now() - at < OVERRIDE_TTL);
    } catch (e) {
      return false;
    }
  }

  function resolveTheme() {
    if (hasManualOverride()) {
      try { return localStorage.getItem('theme'); } catch (e) {}
    }
    return autoTheme();
  }

  function setThemeAttr(val) {
    try {
      document.documentElement.dataset.theme = val;
    } catch (e) {
      document.documentElement.setAttribute('data-theme', val);
    }
  }
  function getThemeAttr() {
    var el = document.documentElement;
    try {
      if (el.dataset && el.dataset.theme) return el.dataset.theme;
    } catch (e) {}
    return el.getAttribute('data-theme');
  }

  setThemeAttr(resolveTheme());

  setInterval(function () {
    if (hasManualOverride()) return;
    var next = autoTheme();
    if (getThemeAttr() !== next) setThemeAttr(next);
  }, 60000);
})();

(function () {

  var root = document.documentElement;
  var colors = { light: '#fdfbfc', dark: '#14121a' };

    } catch (e) {}

  }

  function apply(theme) {
    if (root.dataset.theme === theme) return;
    root.dataset.theme = theme;
    var meta = document.querySelector('meta[name="theme-color"]');

  apply(stored() || auto());

  setInterval(function () {
    if (!stored()) apply(auto());
  }, 60000);

<script>
(function () {
  'use strict';

  var reduced = false;
  try {
    reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch (e) {}

  function $(sel) { return document.querySelector(sel); }
  function $$(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }

  var navbar = $('#navbar');
  var toTop  = $('#toTop');

  var raf = window.requestAnimationFrame || function (fn) { return setTimeout(fn, 16); };

  var themeBtn = $('#themeToggle');
  if (themeBtn) {
    themeBtn.addEventListener('click', function () {
      var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = next === 'dark' ? '#14121a' : '#fdfbfc';
      try {
        localStorage.setItem('theme', next);
        localStorage.setItem('themeAt', String(Date.now()));
      } catch (e) {}
    });
  }

  function initExpandCards() {
    $$('.dl-card--expand').forEach(function (card) {
      var head = card.querySelector('.dl-expand-head');
      if (!head) return;

      head.addEventListener('click', function () {
        var expanded = card.classList.toggle('expanded');
        head.setAttribute('aria-expanded', String(expanded));
      });
    });
  }

  function initReveal() {
    var els = $$('[data-reveal]');

    if (!('IntersectionObserver' in window) || reduced) {
      els.forEach(function (el) { el.classList.add('from-below', 'is-in'); });
      return;
    }

    els.forEach(function (el, i) {
      el.classList.add('from-below');
      el.style.setProperty('--reveal-delay', ((i % 4) * 75) + 'ms');
    });

    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        var el = entry.target;

        if (entry.isIntersecting) {
          if (el.classList.contains('is-in')) return;

          var fromBelow = entry.boundingClientRect.top >= 0;
          var wanted = fromBelow ? 'from-below' : 'from-above';
          var current = el.classList.contains('from-below') ? 'from-below' :
                       (el.classList.contains('from-above') ? 'from-above' : null);

          if (current !== wanted) {
            el.classList.add('no-transition');
            el.classList.remove('from-below', 'from-above');
            el.classList.add(wanted);
            void el.offsetWidth;
            el.classList.remove('no-transition');
          }
          el.classList.add('is-in');
        } else {
          if (el.classList.contains('is-in')) {
            el.classList.add('no-transition');
            el.classList.remove('is-in');
            void el.offsetWidth;
            el.classList.remove('no-transition');
          }
        }
      });
    }, { threshold: 0, rootMargin: '-60px 0px -60px 0px' });

    els.forEach(function (el) { io.observe(el); });
  }

  function initScrollUI() {
    var ticking = false;

    window.addEventListener('scroll', function () {
      if (ticking) return;
      ticking = true;
      raf(function () {
        var y = window.scrollY;
        if (navbar) navbar.classList.toggle('scrolled', y > 10);
        if (toTop) toTop.classList.toggle('show', y > 500);
        ticking = false;
      });
    }, { passive: true });

    if (toTop) {
      toTop.addEventListener('click', function () {
        window.scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' });
      });
    }
  }

  function initMobileMenu() {
    var btn = $('#mobileMenuBtn');
    var list = $('#navLinks');
    if (!btn || !list) return;

    function close() {
      list.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
    }

    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = list.classList.toggle('open');
      btn.setAttribute('aria-expanded', String(open));
    });

    list.addEventListener('click', function (e) {
      if (e.target.tagName === 'A') close();
    });

    document.addEventListener('click', function (e) {
      if (!list.classList.contains('open')) return;
      if (list.contains(e.target) || btn.contains(e.target)) return;
      close();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') close();
    });
  }

  try {
    document.body.classList.add('page-enter');
    initExpandCards();
    initReveal();
    initScrollUI();
    initMobileMenu();
  } catch (e) {
    $$('[data-reveal]').forEach(function (el) { el.classList.add('is-in'); });
  }
})();
</script>
