<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="MeowRC 在线游戏板块 —— 把数学、创意与对战装进浏览器，在线即玩。">
<title>游戏板块 · MeowRC Online</title>
<style>
  :root{
    --pink:#f5a0b8; --pink-deep:#e8769b; --ink:#2b2b33; --muted:#7a7a86;
    --bg:#fdf6f9; --card:#ffffff; --line:#f0d9e2; --shadow:0 10px 30px rgba(232,118,155,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#fff 0%,var(--bg) 42%);
    color:var(--ink); line-height:1.6; padding:32px 16px 64px; min-height:100vh;
  }
  .wrap{max-width:960px;margin:0 auto}
  header.hero{text-align:center;margin-bottom:40px}
  .badge{
    display:inline-block;font-size:13px;letter-spacing:.18em;color:var(--pink-deep);
    background:var(--line);padding:6px 14px;border-radius:999px;margin-bottom:18px;
  }
  h1{
    font-size:clamp(28px,5vw,44px);font-weight:800;
    background:linear-gradient(90deg,var(--pink-deep),var(--pink));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{color:var(--muted);margin-top:10px;font-size:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;
    box-shadow:var(--shadow);transition:transform .18s ease, box-shadow .18s ease;
    display:flex;flex-direction:column;
  }
  .card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(232,118,155,.2)}
  .thumb{
    height:120px;border-radius:14px;background:linear-gradient(135deg,var(--pink),#ffd1e0);
    display:flex;align-items:center;justify-content:center;font-size:48px;margin-bottom:16px;
  }
  .card h2{font-size:22px;margin-bottom:8px}
  .card p{color:var(--muted);font-size:15px;flex:1}
  .tags{margin:14px 0}
  .tag{
    display:inline-block;font-size:12px;color:var(--pink-deep);background:var(--line);
    padding:4px 10px;border-radius:8px;margin:0 6px 6px 0;
  }
  .btns{display:flex;gap:10px;margin-top:8px}
  .btn{
    flex:1;text-align:center;text-decoration:none;padding:11px 14px;border-radius:12px;
    font-weight:600;font-size:15px;transition:.15s;
  }
  .btn-primary{background:var(--pink-deep);color:#fff}
  .btn-primary:hover{background:#d9618c}
  .btn-ghost{background:#fff;color:var(--pink-deep);border:1px solid var(--line)}
  .btn-ghost:hover{background:var(--bg)}
  .note{font-size:13px;color:var(--muted);margin-top:28px;text-align:center}
  .foot{text-align:center;margin-top:48px}
  .back{
    display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--pink-deep);
    font-weight:600;padding:10px 18px;border:1px solid var(--line);border-radius:999px;background:#fff;
  }
  .back:hover{background:var(--bg)}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <span class="badge">MEOWRC · GAME ZONE</span>
    <h1>游戏板块</h1>
    <p class="sub">把数学、创意与对战装进浏览器 —— 在线即玩，无需下载。</p>
  </header>

  <main class="grid">
    <article class="card">
      <div class="thumb">♟️</div>
      <h2>函数棋</h2>
      <p>把函数画在坐标系上，用函数图像进行攻防对战的创意策略游戏。支持单机闯关、本地双人、在线对战与 AI 对局。</p>
      <div class="tags">
        <span class="tag">策略</span>
        <span class="tag">数学</span>
        <span class="tag">纯客户端运行</span>
      </div>
      <div class="btns">
        <a class="btn btn-primary" href="hanshuqi/">立即游玩</a>
        <a class="btn btn-ghost" href="hanshuqi/%E5%87%BD%E6%95%B0%E6%A3%8B%E5%AE%8C%E6%95%B4%E6%B8%B8%E6%88%8F%E6%89%8B%E5%86%8C.txt">游戏手册</a>
      </div>
    </article>
  </main>

  <p class="note">首个游戏：函数棋 v2.0.0.2 · 全部资源托管于本仓库，首次进入加载约需几秒。</p>

  <div class="foot">
    <a class="back" href="/Online/">← 返回 Online 主页</a>
  </div>
</div>
</body>
</html>
